<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Obscura · coming soon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./styles/comming_soon.css">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=MedievalSharp&family=Cinzel+Decorative:wght@400;700;900&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-[#020101] relative">
  <div class="gothic-overlay relative w-full max-w-4xl mx-auto rounded-none overflow-hidden shadow-2xl"
       style="background: linear-gradient(170deg, #0a0305 0%, #050102 30%, #020001 60%, #0a0305 100%);">

    <div class="absolute inset-0 opacity-20 mix-blend-screen pointer-events-none">
      <div class="absolute -top-10 -left-10 w-48 h-64 border-2 border-red-950/30 transform -rotate-12"
           style="clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);"></div>
      <div class="absolute -bottom-10 -right-10 w-56 h-72 border-2 border-red-950/25 transform rotate-12"
           style="clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);"></div>
      <div class="absolute top-1/4 right-10 w-32 h-32 border border-red-900/20 rounded-full"></div>
      <div class="absolute bottom-1/4 left-10 w-24 h-24 border border-red-900/15 rounded-full"></div>
    </div>

    <div class="content-relative flex flex-col items-center justify-center px-6 py-14 md:py-18 w-full">

      <div class="w-full flex justify-center mb-8 md:mb-10">
        <div class="flex items-center w-72 md:w-96">
          <span class="flex-1 h-px bg-gradient-to-r from-transparent via-red-800/80 to-red-900/90"></span>
          <span class="mx-4 text-red-700/70 text-3xl medieval-text transform rotate-90">☩</span>
          <span class="flex-1 h-px bg-gradient-to-l from-transparent via-red-800/80 to-red-900/90"></span>
        </div>
      </div>

      <div class="text-center mb-6 md:mb-8">
        <h1 class="gothic-title text-7xl md:text-8xl lg:text-9xl text-[#fdf5f5] tracking-widest porcelain-skin">
          Obscura
        </h1>
        <div class="flex justify-center items-center gap-4 mt-3">
          <div class="w-14 h-0.5 bg-gradient-to-r from-transparent to-red-800/80"></div>
          <p class="medieval-text text-2xl md:text-3xl text-red-300/90 italic tracking-[0.3em] porcelain-skin">the veil thins</p>
          <div class="w-14 h-0.5 bg-gradient-to-l from-transparent to-red-800/80"></div>
        </div>
      </div>

      <div class="my-6 md:my-8 flex justify-center">
        <div class="relative w-40 h-40 md:w-48 md:h-48 flex items-center justify-center">
          <div class="absolute inset-0 border-2 border-red-800/50 rotate-45 shadow-[0_0_40px_rgba(80,15,25,0.6)]"></div>
          <div class="absolute inset-3 border border-red-900/40 rotate-45"></div>
          <div class="absolute inset-6 border border-red-800/30 rotate-45 shadow-[inset_0_0_30px_rgba(60,8,15,0.5)]"></div>

          <div class="relative w-16 h-16 flex items-center justify-center">
            <div class="absolute w-2.5 h-full bg-gradient-to-b from-red-900/95 via-black to-red-900/95 shadow-[0_0_25px_rgba(100,15,25,0.9)]"></div>
            <div class="absolute h-2.5 w-full bg-gradient-to-r from-red-900/95 via-black to-red-900/95 shadow-[0_0_25px_rgba(100,15,25,0.9)]"></div>
          </div>

          <div class="absolute top-1 left-1/2 -translate-x-1/2 w-2 h-3 bg-red-800/90 rounded-full shadow-[0_0_15px_rgba(120,15,25,0.95)]"></div>
          <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-2 h-3 bg-red-800/90 rounded-full shadow-[0_0_15px_rgba(120,15,25,0.95)]"></div>
          <div class="absolute left-1 top-1/2 -translate-y-1/2 w-2 h-3 bg-red-800/90 rounded-full shadow-[0_0_15px_rgba(120,15,25,0.95)]"></div>
          <div class="absolute right-1 top-1/2 -translate-y-1/2 w-2 h-3 bg-red-800/90 rounded-full shadow-[0_0_15px_rgba(120,15,25,0.95)]"></div>
        </div>
      </div>

      <p class="text-base md:text-lg text-red-300/80 tracking-[0.3em] uppercase mb-10 md:mb-12 font-extralight cinzel-text porcelain-skin">
        something wicked this way comes
      </p>

      <div class="timer-ring w-full max-w-xl p-8 md:p-10 flex flex-col items-center justify-center mx-auto my-2 relative">

        <div class="absolute top-0 left-0 w-16 h-16">
          <div class="absolute top-2 left-2 w-full h-full opacity-70">
            <svg viewBox="0 0 50 50" class="w-full h-full stroke-red-800/60 fill-none">
              <path d="M0 0 L20 20 M0 0 L0 50 M0 0 L50 0" stroke-width="0.5"/>
              <path d="M15 15 L30 15 M15 15 L15 30" stroke-width="0.3"/>
              <circle cx="15" cy="15" r="1" fill="rgba(130,15,25,0.7)" stroke="none"/>
            </svg>
          </div>
        </div>
        <div class="absolute top-0 right-0 w-16 h-16 rotate-90">
          <div class="absolute top-2 left-2 w-full h-full opacity-70">
            <svg viewBox="0 0 50 50" class="w-full h-full stroke-red-800/60 fill-none">
              <path d="M0 0 L20 20 M0 0 L0 50 M0 0 L50 0" stroke-width="0.5"/>
              <path d="M15 15 L30 15 M15 15 L15 30" stroke-width="0.3"/>
              <circle cx="15" cy="15" r="1" fill="rgba(130,15,25,0.7)" stroke="none"/>
            </svg>
          </div>
        </div>
        <div class="absolute bottom-0 left-0 w-16 h-16 -rotate-90">
          <div class="absolute top-2 left-2 w-full h-full opacity-70">
            <svg viewBox="0 0 50 50" class="w-full h-full stroke-red-800/60 fill-none">
              <path d="M0 0 L20 20 M0 0 L0 50 M0 0 L50 0" stroke-width="0.5"/>
              <path d="M15 15 L30 15 M15 15 L15 30" stroke-width="0.3"/>
              <circle cx="15" cy="15" r="1" fill="rgba(130,15,25,0.7)" stroke="none"/>
            </svg>
          </div>
        </div>
        <div class="absolute bottom-0 right-0 w-16 h-16 rotate-180">
          <div class="absolute top-2 left-2 w-full h-full opacity-70">
            <svg viewBox="0 0 50 50" class="w-full h-full stroke-red-800/60 fill-none">
              <path d="M0 0 L20 20 M0 0 L0 50 M0 0 L50 0" stroke-width="0.5"/>
              <path d="M15 15 L30 15 M15 15 L15 30" stroke-width="0.3"/>
              <circle cx="15" cy="15" r="1" fill="rgba(130,15,25,0.7)" stroke="none"/>
            </svg>
          </div>
        </div>

        <p class="text-sm md:text-base uppercase tracking-[0.5em] text-red-300/85 mb-6 medieval-text porcelain-skin">The darkness approaches</p>

        <div id="countdown-timer" class="flex flex-wrap items-center justify-center gap-4 md:gap-6 w-full">
          <div class="flex flex-col items-center min-w-[80px]">
            <span id="days" class="text-6xl md:text-8xl font-thin text-[#fff5f5] blood-red-glow tracking-wider">00</span>
            <span class="text-xs md:text-sm uppercase tracking-[0.4em] text-red-400/80 mt-2 font-extralight">nights</span>
          </div>
          <span class="text-5xl md:text-7xl text-red-700/50 font-thin self-start mt-2">:</span>
          <div class="flex flex-col items-center min-w-[80px]">
            <span id="hours" class="text-6xl md:text-8xl font-thin text-[#fff5f5] blood-red-glow tracking-wider">00</span>
            <span class="text-xs md:text-sm uppercase tracking-[0.4em] text-red-400/80 mt-2 font-extralight">hours</span>
          </div>
          <span class="text-5xl md:text-7xl text-red-700/50 font-thin self-start mt-2">:</span>
          <div class="flex flex-col items-center min-w-[80px]">
            <span id="minutes" class="text-6xl md:text-8xl font-thin text-[#fff5f5] blood-red-glow tracking-wider">00</span>
            <span class="text-xs md:text-sm uppercase tracking-[0.4em] text-red-400/80 mt-2 font-extralight">minutes</span>
          </div>
          <span class="text-5xl md:text-7xl text-red-700/50 font-thin self-start mt-2">:</span>
          <div class="flex flex-col items-center min-w-[80px]">
            <span id="seconds" class="text-6xl md:text-8xl font-thin text-[#fff5f5] blood-red-glow tracking-wider">00</span>
            <span class="text-xs md:text-sm uppercase tracking-[0.4em] text-red-400/80 mt-2 font-extralight">seconds</span>
          </div>
        </div>

        <p class="text-xs text-red-400/70 italic mt-8 max-w-xs text-center leading-relaxed tracking-[0.2em] font-extralight">
          "What is normal for the spider is chaos for the fly."
        </p>
      </div>

      <div class="divider-line w-56 md:w-72 my-10"></div>

      <div class="flex flex-wrap items-center justify-center gap-6 md:gap-10 text-red-400/60 text-xs uppercase tracking-[0.4em] cinzel-text font-extralight">
        <span class="flex items-center gap-3">
          <span class="w-4 h-4 border border-red-800/50 rotate-45 shadow-[0_0_10px_rgba(80,15,25,0.5)]"></span>
          gothic æon
        </span>
        <span class="flex items-center gap-3">
          <span class="w-4 h-4 rounded-full border border-red-900/40 shadow-[0_0_10px_rgba(60,10,15,0.4)]"></span>
          obscura
        </span>
        <span class="flex items-center gap-3">
          <span class="w-4 h-4 border border-red-800/50 rotate-45 shadow-[0_0_10px_rgba(80,15,25,0.5)]"></span>
          MMXXV
        </span>
      </div>

      <div class="mt-10 flex justify-center space-x-10 opacity-50">
        <div class="w-12 h-20 border-2 border-red-900/40 transform -rotate-6"
             style="clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%);"></div>
        <div class="w-16 h-24 border-2 border-red-900/35"
             style="clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%);"></div>
        <div class="w-12 h-20 border-2 border-red-900/40 transform rotate-6"
             style="clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%);"></div>
      </div>
    </div>
  </div>
  <script src="./js/timer.js"></script>
</body>
</html>
